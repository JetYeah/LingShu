name: lingshu
description: "灵枢 — 阴阳五行 × 中医 个人健康管理 App"
publish_to: 'none'
version: 0.1.36+9905

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理与路由
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # 本地加密数据库
  drift: ^2.28.0
  sqlcipher_flutter_libs: ^0.6.5
  sqlite3: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI 与图表
  fl_chart: ^0.71.0

  # 文件与采集
  image_picker: ^1.2.0
  file_picker: ^12.3.0
  image: ^4.3.0

  # 定位
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # 用药提醒
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

  # 安全
  local_auth: ^2.3.0

  # 网络与工具
  http: ^1.4.0
  intl: ^0.20.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  uuid: ^4.5.0
  lunar: ^1.7.8
  archive: ^4.3.0
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/acupoints/
    # 中药配图（herb_images/herb_images_zy/herb_plants，约 73MB）已拆分为
    # 可选下载包，运行时由 HerbPack 解析到应用文档目录，见 herb_pack.dart
    - assets/images/
    - assets/models/

  fonts:
    - family: SerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
